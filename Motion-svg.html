  <meta charset="UTF-8" />

  <title>Animación creativa (tonos azules)</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: #0a0a1a;
      font-family: sans-serif;
      overflow: hidden;
    }

    .svg-container {
      width: 140px;
      height: 150px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: visible;
      animation:
        creativeMove 4400ms ease-in-out infinite,
        colorShiftBlue 4400ms ease-in-out infinite;
    }

    .svg-container svg {
      width: 100%;
      height: 100%;
      display: block;
      filter: drop-shadow(0 8px 20px rgba(0, 100, 255, 0.3));
      transition: filter 0.3s;
    }

    /* Movimiento y opacidad (igual que antes) */
    @keyframes creativeMove {
      0% {
        transform: scale(0.6) rotate(-8deg) translateY(30px) translateX(0);
        opacity: 0;
      }
      15% {
        transform: scale(1.15) rotate(3deg) translateY(0) translateX(0);
        opacity: 1;
      }
      30% {
        transform: scale(0.9) rotate(-2deg) translateY(0) translateX(18px);
        opacity: 0.9;
      }
      50% {
        transform: scale(1.08) rotate(2deg) translateY(-5px) translateX(-15px);
        opacity: 1;
      }
      70% {
        transform: scale(0.95) rotate(-1deg) translateY(8px) translateX(8px);
        opacity: 0.95;
      }
      85% {
        transform: scale(1.02) rotate(0.5deg) translateY(0) translateX(-5px);
        opacity: 1;
      }
      100% {
        transform: scale(1) rotate(0deg) translateY(0) translateX(0);
        opacity: 1;
      }
    }

    /* Cambio de color solo en tonos azules */
    @keyframes colorShiftBlue {
      0% {
        filter: hue-rotate(0deg) saturate(1.2) brightness(1) drop-shadow(0 8px 20px rgba(0, 100, 255, 0.3));
      }
      25% {
        filter: hue-rotate(15deg) saturate(1.5) brightness(1.1) drop-shadow(0 8px 20px rgba(0, 180, 255, 0.4));
      }
      50% {
        filter: hue-rotate(30deg) saturate(1.8) brightness(0.9) drop-shadow(0 8px 20px rgba(0, 220, 255, 0.5));
      }
      75% {
        filter: hue-rotate(15deg) saturate(1.3) brightness(1.05) drop-shadow(0 8px 20px rgba(30, 144, 255, 0.4));
      }
      100% {
        filter: hue-rotate(0deg) saturate(1.2) brightness(1) drop-shadow(0 8px 20px rgba(0, 100, 255, 0.3));
      }
    }

    /* Resplandor de fondo también en azules */
    .glow {
      position: fixed;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(0, 120, 255, 0.15), transparent 70%);
      border-radius: 50%;
      pointer-events: none;
      animation: glowPulseBlue 4400ms ease-in-out infinite alternate;
      transform: translate(-50%, -50%);
      top: 50%;
      left: 50%;
      z-index: -1;
    }

    @keyframes glowPulseBlue {
      0% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
      50% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(0.8); opacity: 0.4; }
    }
  </style>
</head>
