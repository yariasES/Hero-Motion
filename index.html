<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>GeoRoute AI | Georreferenciación con IA</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #010514;
            overflow-x: hidden;
            overflow-y: auto;
            font-family: 'Inter', sans-serif;
            /* Eliminamos height:200vh para que sea dinámico con el contenido */
        }

        /* Canvas fijo a pantalla completa */
        #canvas-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            z-index: 0;
            pointer-events: none;
        }

        /* Overlay de transparencia para mejorar legibilidad del texto */
        .text-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 5;
            pointer-events: none;
            background: linear-gradient(90deg, rgba(1,5,20,0.75) 0%, rgba(1,5,20,0.4) 50%, rgba(1,5,20,0.1) 100%);
        }

        /* Contenedor principal del contenido */
        .content-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            pointer-events: auto;
        }

        /* Hero section (primera pantalla) */
        .hero-section {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 2rem 5%;
        }

        /* Barra de navegación */
        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1.8rem 5%;
            backdrop-filter: blur(8px);
            background: rgba(1, 5, 20, 0.4);
            border-bottom: 1px solid rgba(0, 255, 255, 0.15);
            flex-wrap: wrap;
            gap: 1rem;
            position: relative;
            z-index: 12;
        }

        .logo {
            font-weight: 800;
            font-size: 1.6rem;
            letter-spacing: -0.02em;
            background: linear-gradient(135deg, #FFFFFF, #00e0ff);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
        }

        .nav-links {
            display: flex;
            gap: 2rem;
            flex-wrap: wrap;
        }

        .nav-links a {
            text-decoration: none;
            color: #eef5ff;
            font-weight: 500;
            font-size: 0.9rem;
            transition: 0.3s;
            border-bottom: 1px solid transparent;
            padding-bottom: 4px;
        }

        .nav-links a:hover {
            color: #0ff;
            border-bottom-color: #0ff;
        }

        .customer-login {
            background: rgba(0, 255, 255, 0.1);
            padding: 0.4rem 1.2rem;
            border-radius: 30px;
            border: 1px solid rgba(0, 255, 255, 0.3);
            font-size: 0.85rem;
        }

        .hero-text-container {
            max-width: 55%;
            padding-right: 2rem;
        }

        .badge {
            background: rgba(0, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            padding: 0.3rem 1rem;
            border-radius: 40px;
            font-size: 0.7rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            margin-bottom: 1.5rem;
            border: 1px solid rgba(0, 255, 255, 0.4);
            color: #aaffff;
            text-transform: uppercase;
            display: inline-block;
        }

        .main-title {
            font-size: clamp(2.5rem, 5vw, 4.2rem);
            font-weight: 800;
            line-height: 1.2;
            margin-bottom: 1rem;
            background: linear-gradient(125deg, #FFFFFF, #7bc5ff, #2ad4ff, #0a5cfa);
            background-size: 300% 300%;
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            animation: gradientFlow 6s ease infinite;
            letter-spacing: -0.02em;
        }

        @keyframes gradientFlow {
            0% { background-position: 0% 50%;}
            50% { background-position: 100% 50%;}
            100% { background-position: 0% 50%;}
        }

        .subtitle {
            font-size: clamp(1rem, 2vw, 1.2rem);
            font-weight: 400;
            color: #eef5ff;
            max-width: 550px;
            margin: 1rem 0 2rem;
            line-height: 1.5;
            text-shadow: 0 1px 8px rgba(0,0,0,0.2);
        }

        .btn-view {
            background: linear-gradient(95deg, #00c6ff, #0072ff);
            border: none;
            padding: 0.8rem 2rem;
            border-radius: 40px;
            font-weight: 600;
            font-size: 0.9rem;
            color: white;
            cursor: pointer;
            transition: 0.25s ease;
            box-shadow: 0 5px 15px rgba(0, 114, 255, 0.3);
            letter-spacing: 0.5px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .btn-view:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(0, 198, 255, 0.4);
        }

        /* Sección en blanco (pantalla completa) */
        .blank-section {
            min-height: 100vh;
            width: 100%;
            background: rgba(1, 5, 20, 0.5);
            backdrop-filter: blur(2px);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            z-index: 10;
            border-top: 1px solid rgba(0, 255, 255, 0.1);
        }

        .blank-content {
            text-align: center;
            color: #aaddff;
            font-size: 1rem;
            letter-spacing: 1px;
            opacity: 0.6;
            font-weight: 300;
        }

        /* Scroll indicator */
        .scroll-indicator {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 0.5rem;
            opacity: 0.5;
            z-index: 15;
            pointer-events: none;
        }
        .scroll-indicator .mouse {
            width: 26px;
            height: 42px;
            border: 2px solid #88bbff;
            border-radius: 20px;
            position: relative;
        }
        .scroll-indicator .wheel {
            width: 4px;
            height: 8px;
            background: #0ff;
            border-radius: 2px;
            position: absolute;
            top: 8px;
            left: 50%;
            transform: translateX(-50%);
            animation: scrollWheel 1.8s infinite;
        }
        @keyframes scrollWheel {
            0% { opacity: 1; transform: translateX(-50%) translateY(0);}
            80% { opacity: 0; transform: translateX(-50%) translateY(15px);}
            100% { opacity: 0; transform: translateX(-50%) translateY(0);}
        }

        @media (max-width: 900px) {
            .hero-text-container {
                max-width: 100%;
                text-align: center;
                padding-right: 0;
            }
            .hero-section {
                justify-content: center;
                text-align: center;
            }
            .navbar {
                flex-direction: column;
                text-align: center;
            }
            .scroll-indicator {
                left: 50%;
                transform: translateX(-50%);
            }
            .text-overlay {
                background: rgba(1,5,20,0.7);
            }
        }
    </style>
</head>
<body>

    <canvas id="canvas-bg"></canvas>
    <div class="text-overlay"></div>

    <div class="content-wrapper">
        <div class="navbar">
            <div class="logo"></div>
        </div>

        <div class="hero-section">
        </div>

        <!-- Sección en blanco (pantalla completa) -->
        <div class="blank-section">
            <div class="blank-content">
                <!-- Contenido mínimo, casi vacío, para respetar "pantalla en blanco" -->
                <span></span>
            </div>
        </div>
    </div>

    <div class="scroll-indicator">
        <div class="mouse">
            <div class="wheel"></div>
        </div>
        <span style="font-size: 0.7rem;"></span>
    </div>

    <script>
        (function() {
            // CANVAS ANIMADO (FONDO COMPLETO CON ROTACIÓN Y ESCALA AL SCROLL)
            const canvas = document.getElementById('canvas-bg');
            let ctx = canvas.getContext('2d');
            let width, height;
            
            let scrollY = 0;
            let targetScrollFactor = 0;
            let currentScrollFactor = 0;
            let currentAngle = 0;
            let currentScale = 1;
            
            const MAX_SCROLL = 500;
            const MAX_ANGLE = Math.PI * 0.28;
            const MAX_SCALE = 1.45;
            
            let particles = [];
            const PARTICLE_COUNT = 110;
            const BASE_CONNECTION_DIST = 175;
            
            let startPoint = null, endPoint = null;
            let routeProgress = 0;
            let routeSpeed = 0.005;
            let routeTimer = 0;
            let animationTime = 0;
            
            class Particle {
                constructor(x, y, radius, color) {
                    this.x = x; this.y = y;
                    this.freqX = 0.002 + Math.random() * 0.003;
                    this.freqY = 0.002 + Math.random() * 0.003;
                    this.phaseX = Math.random() * Math.PI * 2;
                    this.phaseY = Math.random() * Math.PI * 2;
                    this.ampX = 15 + Math.random() * 25;
                    this.ampY = 12 + Math.random() * 20;
                    this.centerX = x; this.centerY = y;
                    this.radius = radius;
                    this.color = color;
                    this.pulse = Math.random() * Math.PI * 2;
                    this.driftAngle = Math.random() * Math.PI * 2;
                    this.driftSpeed = 0.05 + Math.random() * 0.1;
                }
                update(now) {
                    this.x = this.centerX + Math.sin(now * this.freqX + this.phaseX) * this.ampX;
                    this.y = this.centerY + Math.cos(now * this.freqY + this.phaseY) * this.ampY;
                    this.driftAngle += this.driftSpeed * 0.008;
                    let driftX = Math.sin(this.driftAngle) * 1.8;
                    let driftY = Math.cos(this.driftAngle * 0.7) * 1.5;
                    this.x += driftX; this.y += driftY;
                    if(this.x < -80) this.x = width + 80;
                    if(this.x > width + 80) this.x = -80;
                    if(this.y < -80) this.y = height + 80;
                    if(this.y > height + 80) this.y = -80;
                    let dxToCenter = this.centerX - this.x;
                    let dyToCenter = this.centerY - this.y;
                    if(Math.abs(dxToCenter) > 120) this.centerX = this.x;
                    if(Math.abs(dyToCenter) > 120) this.centerY = this.y;
                    this.pulse += 0.015;
                }
                draw(ctx) {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius, 0, Math.PI*2);
                    ctx.fillStyle = this.color;
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = `rgba(0, 200, 255, 0.6)`;
                    ctx.fill();
                    ctx.shadowBlur = 0;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.radius * 0.5, 0, Math.PI*2);
                    ctx.fillStyle = `rgba(210, 240, 255, 0.9)`;
                    ctx.fill();
                }
            }
            
            function initParticles() {
                particles = [];
                for(let i = 0; i < PARTICLE_COUNT; i++) {
                    let x = Math.random() * width;
                    let y = Math.random() * height;
                    let radius = 2 + Math.random() * 4;
                    let color = `rgba(0, ${160 + Math.random() * 95}, 255, 0.75)`;
                    particles.push(new Particle(x, y, radius, color));
                }
            }
            
            function drawConnections() {
                const maxDist = BASE_CONNECTION_DIST;
                for(let i = 0; i < particles.length; i++) {
                    for(let j = i+1; j < particles.length; j++) {
                        let dx = particles[i].x - particles[j].x;
                        let dy = particles[i].y - particles[j].y;
                        let dist = Math.hypot(dx, dy);
                        if(dist < maxDist) {
                            let intensity = 1 - (dist / maxDist);
                            let alpha = intensity * 0.25;
                            ctx.beginPath();
                            ctx.moveTo(particles[i].x, particles[i].y);
                            ctx.lineTo(particles[j].x, particles[j].y);
                            ctx.strokeStyle = `rgba(0, 210, 255, ${alpha})`;
                            ctx.lineWidth = 1.0;
                            ctx.stroke();
                            if(intensity > 0.55 && (Math.sin(Date.now() * 0.003 + i) > 0.5)) {
                                let midX = (particles[i].x + particles[j].x) / 2;
                                let midY = (particles[i].y + particles[j].y) / 2;
                                ctx.beginPath();
                                ctx.arc(midX, midY, 1.5, 0, Math.PI*2);
                                ctx.fillStyle = `rgba(100, 255, 200, 0.7)`;
                                ctx.fill();
                            }
                        }
                    }
                }
            }
            
            function generateNewRoute() {
                if(particles.length < 2) return;
                let idxA = Math.floor(Math.random() * particles.length);
                let idxB = Math.floor(Math.random() * particles.length);
                while(idxB === idxA && particles.length > 1) idxB = Math.floor(Math.random() * particles.length);
                startPoint = particles[idxA];
                endPoint = particles[idxB];
                routeProgress = 0;
                routeSpeed = 0.004 + Math.random() * 0.006;
            }
            
            function drawAnimatedRoute() {
                if(!startPoint || !endPoint) return;
                if(routeProgress >= 1) {
                    if(routeTimer > 20) {
                        generateNewRoute();
                        routeTimer = 0;
                    } else {
                        routeTimer++;
                    }
                    return;
                }
                routeProgress += routeSpeed;
                if(routeProgress >= 1) routeProgress = 1;
                let currentX = startPoint.x + (endPoint.x - startPoint.x) * routeProgress;
                let currentY = startPoint.y + (endPoint.y - startPoint.y) * routeProgress;
                ctx.beginPath();
                ctx.moveTo(startPoint.x, startPoint.y);
                ctx.lineTo(endPoint.x, endPoint.y);
                ctx.strokeStyle = `rgba(60, 255, 230, 0.7)`;
                ctx.lineWidth = 2.2;
                ctx.shadowBlur = 12;
                ctx.shadowColor = "#0ff";
                ctx.stroke();
                ctx.setLineDash([8, 8]);
                ctx.beginPath();
                ctx.moveTo(startPoint.x, startPoint.y);
                ctx.lineTo(endPoint.x, endPoint.y);
                ctx.strokeStyle = `rgba(0, 210, 200, 0.6)`;
                ctx.lineWidth = 1.2;
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(currentX, currentY, 7 + Math.sin(Date.now() * 0.008) * 1.2, 0, Math.PI*2);
                ctx.fillStyle = "#ffffff";
                ctx.shadowBlur = 14;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(currentX, currentY, 3.5, 0, Math.PI*2);
                ctx.fillStyle = "#0cf";
                ctx.fill();
                ctx.beginPath();
                ctx.arc(currentX, currentY, 12 + Math.sin(Date.now() * 0.01) * 2, 0, Math.PI*2);
                ctx.strokeStyle = `rgba(0, 255, 210, 0.9)`;
                ctx.lineWidth = 1.5;
                ctx.stroke();
                ctx.shadowBlur = 0;
                ctx.beginPath();
                ctx.arc(startPoint.x, startPoint.y, 5, 0, Math.PI*2);
                ctx.fillStyle = "#ffaa44";
                ctx.shadowBlur = 8;
                ctx.fill();
                ctx.beginPath();
                ctx.arc(endPoint.x, endPoint.y, 5, 0, Math.PI*2);
                ctx.fillStyle = "#ff5566";
                ctx.fill();
                ctx.shadowBlur = 0;
            }
            
            function drawDynamicGrid() {
                const step = 50;
                const extra = step * 3;
                const startX = -extra;
                const endX = width + extra;
                const startY = -extra;
                const endY = height + extra;
                ctx.strokeStyle = `rgba(0, 160, 210, 0.1)`;
                ctx.lineWidth = 0.6;
                for (let x = startX; x <= endX; x += step) {
                    ctx.beginPath();
                    ctx.moveTo(x, startY);
                    ctx.lineTo(x, endY);
                    ctx.stroke();
                }
                for (let y = startY; y <= endY; y += step) {
                    ctx.beginPath();
                    ctx.moveTo(startX, y);
                    ctx.lineTo(endX, y);
                    ctx.stroke();
                }
                ctx.strokeStyle = `rgba(0, 200, 240, 0.1)`;
                const diagStep = 65;
                for (let i = -width - extra; i < width + height + extra; i += diagStep) {
                    ctx.beginPath();
                    ctx.moveTo(i, startY);
                    ctx.lineTo(i + (endY - startY), endY);
                    ctx.stroke();
                }
                for (let i = -width - extra; i < width + height + extra; i += diagStep) {
                    ctx.beginPath();
                    ctx.moveTo(width + extra - i, startY);
                    ctx.lineTo(width + extra - i - (endY - startY), endY);
                    ctx.stroke();
                }
            }
            
            let radarTime = 0;
            function drawHarmonicRadar() {
                radarTime += 0.01;
                let centerX = width * 0.5;
                let centerY = height * 0.55;
                let baseRadius = 70;
                for(let i = 1; i <= 3; i++) {
                    let offset = (Date.now() * 0.0015 + i) % (Math.PI*2);
                    let radius = baseRadius + Math.sin(offset) * 18;
                    ctx.beginPath();
                    ctx.arc(centerX + Math.sin(radarTime)*15, centerY + Math.cos(radarTime*0.6)*12, radius, 0, Math.PI*2);
                    ctx.strokeStyle = `rgba(0, 210, 250, 0.2)`;
                    ctx.lineWidth = 1.2;
                    ctx.stroke();
                }
            }
            
            function updateScrollFactor() {
                scrollY = window.scrollY;
                let rawFactor = Math.min(1, scrollY / MAX_SCROLL);
                targetScrollFactor = rawFactor;
                currentScrollFactor += (targetScrollFactor - currentScrollFactor) * 0.08;
                currentAngle = currentScrollFactor * MAX_ANGLE;
                currentScale = 1 + currentScrollFactor * (MAX_SCALE - 1);
            }
            
            function animateCanvas() {
                if(!ctx) return;
                updateScrollFactor();
                let grad = ctx.createLinearGradient(0, 0, width*0.7, height);
                grad.addColorStop(0, '#020a1c');
                grad.addColorStop(0.6, '#03102a');
                grad.addColorStop(1, '#01061a');
                ctx.fillStyle = grad;
                ctx.fillRect(0, 0, width, height);
                
                ctx.save();
                const centerX = width / 2;
                const centerY = height / 2;
                ctx.translate(centerX, centerY);
                ctx.rotate(currentAngle);
                ctx.scale(currentScale, currentScale);
                ctx.translate(-centerX, -centerY);
                
                animationTime += 0.016;
                drawDynamicGrid();
                drawHarmonicRadar();
                for(let p of particles) p.update(animationTime);
                drawConnections();
                for(let p of particles) p.draw(ctx);
                drawAnimatedRoute();
                
                ctx.restore();
                
                ctx.fillStyle = `rgba(100, 200, 255, 0.08)`;
                if(Math.random() < 0.02) {
                    let randX = Math.random() * width;
                    let randY = Math.random() * height;
                    ctx.beginPath();
                    ctx.arc(randX, randY, 3, 0, Math.PI*2);
                    ctx.fill();
                }
                requestAnimationFrame(animateCanvas);
            }
            
            function resizeCanvas() {
                width = window.innerWidth;
                height = window.innerHeight;
                canvas.width = width;
                canvas.height = height;
                if(ctx) ctx = canvas.getContext('2d');
                initParticles();
                generateNewRoute();
            }
            
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();
            animateCanvas();
            
            const exploreBtn = document.getElementById('exploreBtn');
            if(exploreBtn) {
                exploreBtn.addEventListener('click', () => {
                    alert("");
                });
            }
        })();
    </script>
</body>
</html>
